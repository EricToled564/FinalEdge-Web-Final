<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Edge Engine — 3D</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{--bg:#0E0E12;--accent:#1E80F0;--fg:#F4F4F2;--faint:#7E7E88}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Geist Mono",monospace;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:28px;left:0;right:0;text-align:center}
.top .eye{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.top h1{font-size:clamp(22px,3vw,34px);font-weight:600;letter-spacing:-.03em;margin-top:6px}
.top h1 .b{color:var(--accent)}
.hint{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:13px;color:var(--faint);letter-spacing:.05em}
.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--faint);letter-spacing:.1em;z-index:3}
.load .cur{color:var(--accent);animation:bl 1.2s steps(1) infinite}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="load" id="load">&gt;_ cargando el motor <span class="cur">█</span></div>
<div class="ui">
  <div class="top"><div class="eye">&gt;_ el motor</div><h1>Final Edge <span class="b">[ENGINE]</span></h1></div>
  <div class="hint">arrastra para rotar · scroll para acercar</div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';
import { OrbitControls } from './vendor/OrbitControls.js';
import { RoomEnvironment } from './vendor/environments/RoomEnvironment.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0E0E12);

const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 1000);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

scene.add(new THREE.AmbientLight(0x1a2740, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4,6,5); scene.add(key);
const blue = new THREE.PointLight(0x1E80F0, 30, 60); blue.position.set(-5,-2,4); scene.add(blue);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.autoRotate = true; controls.autoRotateSpeed = 0.9;
controls.enablePan = false;

function resize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const loader = new GLTFLoader();
loader.load('models/engine.glb', (gltf)=>{
  const model = gltf.scene;
  scene.add(model);
  model.updateMatrixWorld(true);

  // Frame the camera onto the model's TRUE bbox center (don't move the model)
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const diag = size.length();
  camera.near = diag / 1000; camera.far = diag * 10; camera.updateProjectionMatrix();
  const dist = (diag * 0.5) / Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * 1.1;
  camera.position.set(center.x, center.y + diag * 0.06, center.z + dist);
  controls.target.copy(center);
  controls.minDistance = dist * 0.45;
  controls.maxDistance = dist * 3;
  controls.update();

  // dump scene graph so we know if segments are separable
  const graph = [];
  model.traverse(o => { if (o.isMesh) graph.push({ name: o.name || '(unnamed)', parent: (o.parent && o.parent.name) || '', mat: (o.material && o.material.name) || '' }); });
  window.__graph = graph;

  document.getElementById('load').style.display='none';
  window.__ready = true;

  let mixer=null;
  if (gltf.animations && gltf.animations.length){
    mixer = new THREE.AnimationMixer(model);
    gltf.animations.forEach(a=>mixer.clipAction(a).play());
    window.__hasAnim = true;
  }
  const clock = new THREE.Clock();
  (function loop(){ requestAnimationFrame(loop);
    if(mixer) mixer.update(clock.getDelta());
    controls.update(); renderer.render(scene,camera);
  })();
}, (ev)=>{
  const el=document.getElementById('load');
  if(ev.total) el.firstChild.textContent = '>_ cargando el motor '+Math.round(ev.loaded/ev.total*100)+'% ';
}, (err)=>{
  document.getElementById('load').textContent = '>_ error cargando el modelo';
  console.error(err);
});
</script>
</body></html>
