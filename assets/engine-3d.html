<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Edge Engine — 3D</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{--bg:#0E0E12;--accent:#1E80F0;--fg:#F4F4F2;--mut:#A0A0A8;--faint:#7E7E88;--eval:#F4920C;--cap:#15D9D9;--exe:#E15CDB}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Geist Mono",monospace;overflow:hidden}
#c{position:fixed;inset:0;display:block}
.ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:30px;left:0;right:0;text-align:center}
.top .eye{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.top h1{font-size:clamp(22px,3vw,34px);font-weight:600;letter-spacing:-.03em;margin-top:6px}
.top h1 .b{color:var(--accent)}
.hint{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:13px;color:var(--faint);letter-spacing:.05em}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;transition:opacity .4s,filter .4s;line-height:1.05}
.lbl .pr{font-size:13px;font-weight:600}
.lbl .nm{font-size:15px;font-weight:600;color:var(--fg)}
.lbl .ai{font-size:12px;font-weight:600;margin-left:.25em}
.lbl.off{opacity:.4;filter:grayscale(.4)}
/* active edge readout — bottom-left panel (igloo-style context drawer) */
.drawer{position:absolute;left:38px;bottom:64px;max-width:320px}
.drawer .k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.drawer .act{font-size:34px;font-weight:600;letter-spacing:-.04em;margin:8px 0 2px;line-height:1}
.drawer .lab{font-size:14px;color:var(--mut)}
.drawer .go{margin-top:14px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="top"><div class="eye">&gt;_ el motor</div><h1>Final Edge <span class="b">[ENGINE]</span></h1></div>
  <div class="drawer"><div class="k">&gt;_ edge en foco</div>
    <div class="act" id="act">strategy</div><div class="lab" id="lab">Estrategia</div>
    <div class="go">Entrar →</div></div>
  <div class="hint">mueve el mouse · pasa por cada edge · el motor flota y gira en el espacio</div>
</div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';

const PH={eval:0xF4920C,cap:0x15D9D9,exe:0xE15CDB};
const EDGES=[
 {name:'strategy',     ph:'eval', lab:'Estrategia'},
 {name:'intelligence', ph:'eval', lab:'Business Intelligence'},
 {name:'readiness',    ph:'cap',  lab:'Team Readiness'},
 {name:'flow',         ph:'cap',  lab:'Optimización de Procesos'},
 {name:'systems',      ph:'exe',  lab:'Sistemas'},
 {name:'creative',     ph:'exe',  lab:'Producción Creativa'},
];

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0E0E12);
scene.fog=new THREE.FogExp2(0x0E0E12,0.035);

const camera=new THREE.PerspectiveCamera(40,1,0.1,100);
camera.position.set(0,0.55,5.6);
camera.lookAt(0,0,0);

scene.add(new THREE.AmbientLight(0x2a3a52,1.0));
const key=new THREE.PointLight(0x2b7fe0,26,40); key.position.set(3,4,5); scene.add(key);
const rim=new THREE.PointLight(0xffffff,10,40); rim.position.set(-4,-2,-3); scene.add(rim);

function glowTex(){
  const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;
  const x=cv.getContext('2d');const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);
}
const GTEX=glowTex();
function glow(color,scale,opacity){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.scale.set(scale,scale,1);return sp;
}

const engine=new THREE.Group(); scene.add(engine);
const tilt=new THREE.Group(); tilt.rotation.x=-Math.PI*0.20; engine.add(tilt);
const ring=new THREE.Group(); tilt.add(ring);

const RI=0.50, RO=1.05, GAP=0.085, DEPTH=0.26;
const segMeshes=[];
EDGES.forEach((e,i)=>{
  const a0=(i/6)*Math.PI*2 + GAP, a1=((i+1)/6)*Math.PI*2 - GAP;
  const shape=new THREE.Shape();
  shape.absarc(0,0,RO,a0,a1,false);
  shape.absarc(0,0,RI,a1,a0,true);
  const geo=new THREE.ExtrudeGeometry(shape,{depth:DEPTH,bevelEnabled:true,bevelThickness:0.045,bevelSize:0.045,bevelSegments:2,curveSegments:26});
  geo.translate(0,0,-DEPTH/2);
  const col=new THREE.Color(PH[e.ph]);
  const mat=new THREE.MeshStandardMaterial({color:0x151519,emissive:col,emissiveIntensity:0.62,metalness:0.5,roughness:0.32,transparent:true,opacity:0.97});
  const mesh=new THREE.Mesh(geo,mat);
  const mid=(a0+a1)/2, r=(RI+RO)/2;
  const g=glow(PH[e.ph],1.35,0.5); g.position.set(Math.cos(mid)*r,Math.sin(mid)*r,-0.15); ring.add(g);
  const anchor=new THREE.Object3D(); anchor.position.set(Math.cos(mid)*(RO+0.42),Math.sin(mid)*(RO+0.42),0); ring.add(anchor);
  mesh.userData={i,e,col,glow:g,anchor};
  ring.add(mesh); segMeshes.push(mesh);
});

// crystalline core
const coreGeo=new THREE.IcosahedronGeometry(0.37,1);
const core=new THREE.Mesh(coreGeo,new THREE.MeshStandardMaterial({color:0x0a0a0d,emissive:0x1E80F0,emissiveIntensity:0.85,metalness:0.75,roughness:0.15,flatShading:true}));
tilt.add(core);
const coreWire=new THREE.LineSegments(new THREE.EdgesGeometry(coreGeo),new THREE.LineBasicMaterial({color:0x6db2ff,transparent:true,opacity:0.9}));
core.add(coreWire);
tilt.add(glow(0x1E80F0,2.6,0.55)).userData={core:true};
const coreGlow=tilt.children[tilt.children.length-1];

// particle dust
const NP=900,pos=new Float32Array(NP*3);
for(let i=0;i<NP;i++){const r=3.5+Math.random()*8,t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
  pos[i*3]=r*Math.sin(ph)*Math.cos(t);pos[i*3+1]=r*Math.cos(ph)*0.45;pos[i*3+2]=r*Math.sin(ph)*Math.sin(t);}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const dust=new THREE.Points(pg,new THREE.PointsMaterial({color:0x8890a0,size:0.028,transparent:true,opacity:0.5,depthWrite:false}));
scene.add(dust);

// HTML labels
const labels=EDGES.map(e=>{
  const d=document.createElement('div');d.className='lbl';
  const hex='#'+PH[e.ph].toString(16).padStart(6,'0');
  d.innerHTML='<span class="pr" style="color:'+hex+'">&gt;_</span> <span class="nm">'+e.name+'</span><span class="ai" style="color:'+hex+'">[AI]</span>';
  document.querySelector('.ui').appendChild(d);return d;
});

const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2(-2,-2);
let active=0, targetRot=0, curRot=0, px=0,py=0,tpx=0,tpy=0, hover=-1;
const actEl=document.getElementById('act'), labEl=document.getElementById('lab');
function setActive(i){ active=(i+6)%6; const e=EDGES[active];
  const hex='#'+PH[e.ph].toString(16).padStart(6,'0');
  actEl.textContent=e.name; actEl.style.color=hex; labEl.textContent=e.lab;
  const mid=(active/6)*Math.PI*2 + (1/6)*Math.PI; targetRot=Math.PI/2 - mid;
}
addEventListener('pointermove',ev=>{ mouse.x=(ev.clientX/innerWidth)*2-1; mouse.y=-(ev.clientY/innerHeight)*2+1;
  tpx=(ev.clientX/innerWidth-.5); tpy=(ev.clientY/innerHeight-.5); });
addEventListener('keydown',ev=>{if(ev.key==='ArrowRight')setActive(active+1);if(ev.key==='ArrowLeft')setActive(active-1);});
addEventListener('click',()=>{ if(hover>=0) setActive(hover); });
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const v=new THREE.Vector3();
function project(obj){ obj.getWorldPosition(v); v.project(camera); return {x:(v.x*.5+.5)*innerWidth,y:(-v.y*.5+.5)*innerHeight,z:v.z}; }

let t=0;
function loop(){
  requestAnimationFrame(loop); t+=0.016;
  px+=(tpx-px)*0.05; py+=(tpy-py)*0.05;
  engine.rotation.y=px*0.5; engine.rotation.x=py*0.28;
  curRot+=(targetRot-curRot)*0.06;
  ring.rotation.z=curRot + t*0.05;
  core.rotation.y+=0.004; core.rotation.x+=0.002;
  coreWire.material.opacity=0.65+Math.sin(t*2)*0.25;
  coreGlow.scale.setScalar(2.5+Math.sin(t*1.6)*0.4);
  dust.rotation.y+=0.0005;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(segMeshes,false);
  hover=hits.length? hits[0].object.userData.i : -1;
  const focus=hover>=0? hover : active;
  segMeshes.forEach((m,i)=>{
    const on=i===focus;
    m.material.emissiveIntensity+=((on?1.9:0.5)-m.material.emissiveIntensity)*0.12;
    m.material.opacity+=((on?1:0.85)-m.material.opacity)*0.12;
    m.userData.glow.material.opacity+=((on?0.95:0.28)-m.userData.glow.material.opacity)*0.12;
    const p=project(m.userData.anchor); const L=labels[i];
    L.style.left=p.x+'px'; L.style.top=p.y+'px';
    L.classList.toggle('off',!on);
    L.style.opacity=p.z>1?0:'';
  });
  renderer.render(scene,camera);
}
setActive(0); loop();
window.__ready=true;
</script>
</body></html>
