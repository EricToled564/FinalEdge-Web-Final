<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Edge Engine — 3D</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{--bg:#0E0E12;--accent:#1E80F0;--fg:#F4F4F2;--faint:#7E7E88}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Geist Mono",monospace;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;top:28px;left:0;right:0;text-align:center}
.top .eye{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.top h1{font-size:clamp(22px,3vw,34px);font-weight:600;letter-spacing:-.03em;margin-top:6px}
.top h1 .b{color:var(--accent)}
.hint{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:13px;color:var(--faint);letter-spacing:.05em}
.load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--faint);letter-spacing:.1em;z-index:3}
.load .cur{color:var(--accent);animation:bl 1.2s steps(1) infinite}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="load" id="load">&gt;_ construyendo el motor <span class="cur">█</span></div>
<div class="ui">
  <div class="top"><div class="eye">&gt;_ el motor</div><h1>Final Edge <span class="b">[ENGINE]</span></h1></div>
  <div class="hint" id="hint">pasa el mouse por cada fase o servicio</div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/environments/RoomEnvironment.js';

const Ri=96, Ro=232, RL=174, gap=4, famRi=248, famRo=278, famGap=5;
const AMBER=0xF4920C, CYAN=0x15D9D9, MAG=0xE15CDB, BLUE=0x1E80F0;
const S=0.011, D_SEC=42, D_BAND=30, D_CORE=54, BEV=5;
const hx = n => '#'+n.toString(16).padStart(6,'0');

const EDGES=[
 {word:'strategy',hex:AMBER,phase:'eval',c:330}, {word:'intelligence',hex:AMBER,phase:'eval',c:30},
 {word:'readiness',hex:CYAN,phase:'cap',c:90},   {word:'flow',hex:CYAN,phase:'cap',c:150},
 {word:'systems',hex:MAG,phase:'exe',c:210},     {word:'creative',hex:MAG,phase:'exe',c:270},
];
// band labels — exact brand-book radii/angles
const BANDS=[
 {phase:'eval',hex:AMBER,c:0,name:'EVALUACIÓN',lr:290},
 {phase:'cap', hex:CYAN, c:120,name:'CAPACIDADES',lr:348},
 {phase:'exe', hex:MAG,  c:240,name:'EJECUCIÓN',lr:338},
];

function P(r,deg){ const a=deg*Math.PI/180; return [r*Math.sin(a), r*Math.cos(a)]; }
function sectorShape(a0,a1,ri,ro){
  const s=new THREE.Shape(); let p=P(ro,a0); s.moveTo(p[0],p[1]);
  for(let d=a0;d<=a1;d+=1){p=P(ro,d);s.lineTo(p[0],p[1]);}
  p=P(ro,a1);s.lineTo(p[0],p[1]);
  for(let d=a1;d>=a0;d-=1){p=P(ri,d);s.lineTo(p[0],p[1]);}
  p=P(ri,a0);s.lineTo(p[0],p[1]); s.closePath(); return s;
}
function extrude(shape,depth){
  const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelThickness:BEV,bevelSize:BEV,bevelSegments:3,curveSegments:64});
  g.translate(0,0,-depth/2); return g;
}

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.02;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0E0E12);
scene.fog=new THREE.FogExp2(0x0E0E12,0.026);
const camera=new THREE.PerspectiveCamera(36,1,0.01,100);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.03).texture;
scene.add(new THREE.AmbientLight(0x2a3550,0.55));
const key=new THREE.DirectionalLight(0xffffff,1.7); key.position.set(4,6,6); scene.add(key);
const fill=new THREE.PointLight(0x1E80F0,22,60); fill.position.set(-6,-3,5); scene.add(fill);

function makeTex(draw,cw,ch){
  const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
  const x=cv.getContext('2d'); draw(x,cw,ch);
  const t=new THREE.CanvasTexture(cv); t.anisotropy=16; t.colorSpace=THREE.SRGBColorSpace; t.needsUpdate=true; return t;
}
function shadow(x){ x.shadowColor='rgba(0,0,0,0.92)'; x.shadowBlur=20; x.shadowOffsetX=0; x.shadowOffsetY=4; }
function lockupTexture(word,hex){
  const cw=1024,ch=512,col=hx(hex),white='#F5F5F3';
  return {tex:makeTex((x)=>{ x.clearRect(0,0,cw,ch); x.textBaseline='alphabetic';
    const pS=78,wS=104,aS=70,x0=70,wordY=286; shadow(x);
    x.font=`700 ${pS}px "Geist Mono",monospace`; x.fillStyle=col; x.fillText('>_',x0,wordY);
    const pw=x.measureText('>_ ').width, wx=x0+pw;
    x.font=`600 ${wS}px "Geist Mono",monospace`; x.fillStyle=white; x.fillText(word,wx,wordY);
    x.font=`600 ${aS}px "Geist Mono",monospace`; x.fillStyle=col; x.fillText('[AI]',wx,wordY+aS+26);
  },cw,ch), aspect:cw/ch};
}
function hubTexture(){
  const cw=1024,ch=512;
  return {tex:makeTex((x)=>{ x.clearRect(0,0,cw,ch); x.textBaseline='alphabetic'; shadow(x);
    const pS=70,wS=100,eS=64,wordY=252;
    x.font=`700 ${pS}px "Geist Mono",monospace`; const pw=x.measureText('>_ ').width;
    x.font=`600 ${wS}px "Geist Mono",monospace`; const ww=x.measureText('final edge').width;
    const startX=(cw-(pw+ww))/2, wx=startX+pw;
    x.font=`700 ${pS}px "Geist Mono",monospace`; x.fillStyle='#1E80F0'; x.fillText('>_',startX,wordY);
    x.font=`600 ${wS}px "Geist Mono",monospace`; x.fillStyle='#F5F5F3'; x.fillText('final edge',wx,wordY);
    x.font=`600 ${eS}px "Geist Mono",monospace`; x.fillStyle='#1E80F0'; x.fillText('[ENGINE]',wx,wordY+eS+22);
  },cw,ch), aspect:cw/ch};
}
function bandTexture(name,hex){
  const cw=1024,ch=256;
  return {tex:makeTex((x)=>{ x.clearRect(0,0,cw,ch); x.textAlign='center'; x.textBaseline='middle'; shadow(x);
    x.font=`600 74px "Geist Mono",monospace`; x.letterSpacing='10px'; x.fillStyle=hx(hex); x.fillText(name,cw/2,ch/2);
  },cw,ch), aspect:cw/ch};
}
function plane(o,w,pos,blend){
  const h=w/o.aspect;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map:o.tex,transparent:true,depthWrite:false,depthTest:true,toneMapped:false,
      blending: blend||THREE.NormalBlending, opacity: blend?0:1}));
  m.position.set(pos[0],pos[1],pos[2]); m.renderOrder=10; return m;
}

await document.fonts.load('700 82px "Geist Mono"');
await document.fonts.load('600 82px "Geist Mono"');
await document.fonts.ready;

const wheel=new THREE.Group(); scene.add(wheel);
const hitList=[];
const DARK_BASE=new THREE.Color(0x101016), DARK_DIM=new THREE.Color(0x050507);

BANDS.forEach(b=>{
  const geo=extrude(sectorShape(b.c-60+famGap,b.c+60-famGap,famRi,famRo),D_BAND);
  const mat=new THREE.MeshPhysicalMaterial({color:b.hex,metalness:0.35,roughness:0.17,clearcoat:1,clearcoatRoughness:0.08,emissive:b.hex,emissiveIntensity:0.12,envMapIntensity:1.25});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.userData={kind:'band',phase:b.phase,hex:b.hex,baseCol:new THREE.Color(b.hex),tEmis:0.12,tLit:1};
  wheel.add(mesh); hitList.push(mesh);
  const lp=P(b.lr,b.c);
  wheel.add(plane(bandTexture(b.name,b.hex),150,[lp[0],lp[1],D_SEC/2+BEV+2]));
});

EDGES.forEach(e=>{
  const geo=extrude(sectorShape(e.c-30+gap,e.c+30-gap,Ri,Ro),D_SEC);
  const mat=new THREE.MeshPhysicalMaterial({color:DARK_BASE.clone(),metalness:0.4,roughness:0.44,clearcoat:0.5,clearcoatRoughness:0.3,emissive:new THREE.Color(e.hex),emissiveIntensity:0,envMapIntensity:0.8});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.userData={kind:'sector',phase:e.phase,hex:e.hex,word:e.word,tEmis:0,tLit:1};
  const lk=lockupTexture(e.word,e.hex); const dp=P(RL,e.c);
  const dm=plane(lk,138,[dp[0],dp[1],D_SEC/2+BEV+2]);           // base label (fits without touching dividers)
  const gl=plane(lk,138,[dp[0],dp[1],D_SEC/2+BEV+3],THREE.AdditiveBlending); // glow layer (lights on hover)
  wheel.add(dm); wheel.add(gl);
  mesh.userData.decal=dm; mesh.userData.glow=gl;
  wheel.add(mesh); hitList.push(mesh);
});

const core=new THREE.Mesh(new THREE.CylinderGeometry(84,84,D_CORE,96,1),
  new THREE.MeshPhysicalMaterial({color:0x0a0a0d,metalness:0.55,roughness:0.25,clearcoat:0.6,clearcoatRoughness:0.2,envMapIntensity:0.9}));
core.rotation.x=Math.PI/2; wheel.add(core);
const hub=plane(hubTexture(),150,[0,0,D_CORE/2+2]); wheel.add(hub);   // centered + large
const spinRim=new THREE.Mesh(new THREE.TorusGeometry(93,3.4,16,120,Math.PI*1.7),
  new THREE.MeshStandardMaterial({color:0x1E80F0,emissive:0x1E80F0,emissiveIntensity:1.5,metalness:0.4,roughness:0.3,toneMapped:false}));
spinRim.position.z=D_CORE/2; wheel.add(spinRim);

wheel.scale.setScalar(S);
wheel.updateMatrixWorld(true);
{ const box=new THREE.Box3().setFromObject(wheel); const size=box.getSize(new THREE.Vector3());
  const diag=size.length(); const dist=(diag*0.5)/Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)*1.08;
  camera.position.set(0,0,dist); camera.lookAt(0,0,0); }

document.getElementById('load').style.display='none'; window.__ready=true;

const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2(-2,-2);
let hoverPhase=null, mx=0,my=0,tmx=0,tmy=0;
addEventListener('pointermove',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  tmx=(e.clientX/innerWidth)*2-1; tmy=(e.clientY/innerHeight)*2-1;
});
function resize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

const hint=document.getElementById('hint');
function updateHover(){
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(hitList,false);
  hoverPhase = hits.length ? hits[0].object.userData.phase : null;
  if(hoverPhase){ const b=BANDS.find(x=>x.phase===hoverPhase); hint.textContent='fase · '+b.name.toLowerCase(); hint.style.color=hx(b.hex); }
  else { hint.textContent='pasa el mouse por cada fase o servicio'; hint.style.color=''; }
  hitList.forEach(m=>{
    const on = !hoverPhase || m.userData.phase===hoverPhase;
    m.userData.tLit = on ? 1 : 0.18;
    if(m.userData.kind==='sector') m.userData.tEmis = (hoverPhase && m.userData.phase===hoverPhase) ? 1.5 : 0;
    else m.userData.tEmis = (hoverPhase && m.userData.phase===hoverPhase) ? 0.75 : (hoverPhase?0.03:0.12);
  });
}

let t=0;
function loop(){
  requestAnimationFrame(loop); t+=0.016;
  updateHover();
  mx+=(tmx-mx)*0.06; my+=(tmy-my)*0.06;
  wheel.position.y=Math.sin(t*0.9)*0.05;
  wheel.rotation.x=Math.sin(t*0.7)*0.05 + my*0.15;
  wheel.rotation.y=Math.sin(t*0.5)*0.06 + mx*0.20;
  spinRim.rotation.z-=0.014;
  hitList.forEach(m=>{
    const mat=m.material;
    mat.emissiveIntensity += (m.userData.tEmis-mat.emissiveIntensity)*0.14;
    const lit=m.userData.tLit;
    m.userData._lit = (m.userData._lit==null?1:m.userData._lit) + (lit-(m.userData._lit==null?1:m.userData._lit))*0.14;
    const L=m.userData._lit;
    if(m.userData.kind==='sector'){
      mat.color.copy(DARK_DIM).lerp(DARK_BASE, L);
      const hoveredHere = hoverPhase && m.userData.phase===hoverPhase;
      if(m.userData.decal){ m.userData.decal.material.opacity += (( !hoverPhase?0.92 : (hoveredHere?1:0.32) )-m.userData.decal.material.opacity)*0.14; }
      if(m.userData.glow){ m.userData.glow.material.opacity += (( hoveredHere?0.85:0 )-m.userData.glow.material.opacity)*0.14; } // letters light up on hover
    } else {
      mat.color.copy(m.userData.baseCol).multiplyScalar(0.25+0.75*L);
    }
  });
  renderer.render(scene,camera);
}
loop();
</script>
</body></html>
